<div class="mb-3">
  <button
    *ngIf="authService.isLoggedIn()"
    (click)="addTrip()"
    class="btn btn-info"
  >
    Add Trip
  </button>
</div>

<div class="row g-4">
  <div *ngFor="let trip of trips" class="col-12 col-sm-6 col-md-4">
    <app-trip-card [trip]="trip"></app-trip-card>
  </div>
</div>
