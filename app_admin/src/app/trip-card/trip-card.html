<div class="card" style="width: 16rem;">
  <div class="card-header">{{ trip.name }}</div>
  <img src="assets/images/{{ trip.image }}" alt="trip thumbnail" class="card-img-top">

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <!-- FIXED formatting: length on one line, price on next -->
    <p class="card-subtitle mt-3 mb-0 text-muted">
      {{ trip.length }} only
    </p>
    <p class="card-subtitle mb-3 text-muted">
      {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>

    <p class="card-text" [innerHTML]="trip.description"></p>

    <button
      *ngIf="isLoggedIn()"
      class="btn btn-primary mt-2"
      (click)="editTrip(trip)"
    >
      Edit Trip
    </button>
  </div>
</div>
